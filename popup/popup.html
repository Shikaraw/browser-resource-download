<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=380, initial-scale=1" />
  <title>资源下载器</title>
  <link rel="stylesheet" href="../lib/theme.css" />
  <link rel="stylesheet" href="./popup.css" />
</head>
<body data-state="idle">
  <div class="ambient" aria-hidden="true"></div>

  <!-- ==================== 顶部品牌栏 ==================== -->
  <header class="appbar">
    <div class="brand">
      <span class="logo" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1"
          stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 3.5v10.5" />
          <path d="M7.5 10l4.5 4.5 4.5-4.5" />
          <path d="M4.5 20.5h15" />
        </svg>
      </span>
      <span class="brand-copy">
        <h1>资源下载器</h1>
        <span class="ver" id="app-ver">Edge Resource Downloader</span>
      </span>
    </div>
    <div class="spacer"></div>
    <button type="button" class="btn ghost icon sm" id="btn-rescan" aria-label="重新扫描本页" title="重新扫描" hidden>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"
        stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M20.5 12a8.5 8.5 0 1 1-3-6.5" />
        <path d="M20.5 4v4.5h-4.5" />
      </svg>
    </button>
    <button type="button" class="btn ghost icon sm" id="btn-settings" aria-label="打开设置" title="设置">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"
        stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M4 7.5h9.5" />
        <circle cx="16.5" cy="7.5" r="2.2" />
        <path d="M4 16.5h5.5" />
        <circle cx="12.5" cy="16.5" r="2.2" />
      </svg>
    </button>
  </header>

  <!-- 提示条容器：作为文档流内元素插在顶部栏之后，
       自带占位高度，因此永远不会盖住卡片网格内容 -->
  <div id="toast-host" class="toast-host" role="status" aria-live="polite"></div>

  <!-- ==================== 当前页面信息 ==================== -->
  <div id="page-info" class="page-info" aria-label="当前页面信息">
    <span class="tile" id="page-tile" aria-hidden="true">·</span>
    <span class="page-meta grow">
      <span class="host truncate" id="page-host">正在读取当前标签页…</span>
      <span class="title truncate" id="page-title"></span>
    </span>
    <span class="tag" id="page-badge" data-kind="other">检测中</span>
  </div>

  <!-- 以标签页形式打开时的轻提示 -->
  <div id="tab-mode-hint" class="tab-mode-hint" role="status" hidden>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"
      stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <circle cx="12" cy="12" r="8.4" />
      <path d="M12 11.2v5" />
      <path d="M12 8v.4" />
    </svg>
    <span id="tab-mode-hint-text"></span>
  </div>

  <main id="stage" class="stage">
    <!-- ==================== 状态 1：idle ==================== -->
    <section id="view-idle" class="view" aria-label="欢迎">
      <div class="idle-wrap">
        <div class="hero-orb" aria-hidden="true">
          <span class="orb-glow"></span>
          <span class="orb-ring"></span>
          <span class="orb-core">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
              stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 3.5v10.5" />
              <path d="M7.5 10l4.5 4.5 4.5-4.5" />
              <path d="M4.5 20.5h15" />
            </svg>
          </span>
          <span class="orb-dot d1"></span>
          <span class="orb-dot d2"></span>
          <span class="orb-dot d3"></span>
        </div>

        <h2 class="idle-title">发现本页的媒体资源</h2>
        <p class="idle-sub">视频 · 图片 · 音频 · 文件，勾选后一键批量下载。</p>

        <button type="button" class="btn primary lg block btn-scan" id="btn-scan">
          <span class="scan-ico" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"
              stroke-linecap="round" stroke-linejoin="round">
              <path d="M4 8V5.6A1.6 1.6 0 0 1 5.6 4H8" />
              <path d="M16 4h2.4A1.6 1.6 0 0 1 20 5.6V8" />
              <path d="M20 16v2.4A1.6 1.6 0 0 1 18.4 20H16" />
              <path d="M8 20H5.6A1.6 1.6 0 0 1 4 18.4V16" />
              <path d="M4.5 12h15" />
            </svg>
          </span>
          <span class="scan-label">扫描本页资源</span>
          <span class="scan-arrow" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
              stroke-linecap="round" stroke-linejoin="round">
              <path d="M5 12h13" />
              <path d="M13.5 7.5L18 12l-4.5 4.5" />
            </svg>
          </span>
        </button>

        <p class="privacy">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"
            stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M12 3l7.5 3v5c0 4.6-3.2 8.2-7.5 9.5C7.7 19.2 4.5 15.6 4.5 11V6L12 3z" />
            <path d="M8.7 11.9l2.3 2.3 4.3-4.7" />
          </svg>
          <span>仅在点击后读取本页内容 · 不上传任何数据</span>
        </p>

        <div class="card glass last-scan" id="last-scan-card" hidden>
          <span class="last-scan-ico" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"
              stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="8.2" />
              <path d="M12 7.6v4.8l3 2" />
            </svg>
          </span>
          <span class="col grow last-scan-copy">
            <span class="last-scan-title" id="last-scan-title">上次扫描</span>
            <span class="last-scan-sub" id="last-scan-sub"></span>
          </span>
        </div>

        <ul class="feat-row">
          <li>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"
              stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <circle cx="12" cy="12" r="8.4" />
              <path d="M8.2 12.1l2.6 2.6 5-5.4" />
            </svg>
            <span>本地扫描</span>
          </li>
          <li>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"
              stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M4 7.5 12 3.5l8 4-8 4z" />
              <path d="M4 12.5 12 16.5l8-4" />
              <path d="M4 17.5 12 21.5l8-4" />
            </svg>
            <span>自动归档</span>
          </li>
          <li>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"
              stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M13 3.5 5.5 13.5h4.8L8 20.5l8-11h-4.7z" />
            </svg>
            <span>并发下载</span>
          </li>
        </ul>
      </div>
    </section>

    <!-- ==================== 状态 2：scanning ==================== -->
    <section id="view-scanning" class="view" aria-label="正在扫描">
      <div class="scan-wrap">
        <div class="radar" aria-hidden="true">
          <span class="ring r1"></span>
          <span class="ring r2"></span>
          <span class="ring r3"></span>
          <span class="sweep"></span>
          <span class="ping"></span>
          <span class="radar-core">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"
              stroke-linecap="round" stroke-linejoin="round">
              <path d="M4 8V5.6A1.6 1.6 0 0 1 5.6 4H8" />
              <path d="M16 4h2.4A1.6 1.6 0 0 1 20 5.6V8" />
              <path d="M20 16v2.4A1.6 1.6 0 0 1 18.4 20H16" />
              <path d="M8 20H5.6A1.6 1.6 0 0 1 4 18.4V16" />
              <path d="M4.5 12h15" />
            </svg>
          </span>
        </div>

        <h2 class="scan-title" id="scan-phase">正在扫描本页资源…</h2>
        <p class="scan-sub" id="scan-detail">正在收集页面元素</p>

        <div id="scan-progress" class="progress scan-bar" role="progressbar"
          aria-label="扫描进度" aria-valuemin="0" aria-valuemax="100" aria-valuenow="8">
          <i></i>
        </div>

        <div class="scan-meta">
          <span class="scan-found"><b id="scan-found">0</b> 项已发现</span>
          <span class="dim" id="scan-elapsed">0.0s</span>
        </div>

        <button type="button" class="btn danger" id="btn-cancel-scan">取消扫描</button>
        <p class="scan-hint dim">扫描在你的浏览器本地完成，结果不会离开这台设备。</p>
      </div>
    </section>

    <!-- ==================== 状态 3/4：results / downloading ==================== -->
    <section id="view-results" class="view" aria-label="扫描结果">
      <div class="results-toolbar">
        <div id="kind-chips" class="chips" role="group" aria-label="按资源类型筛选"></div>

        <div class="toolbar-row">
          <div class="input-group grow">
            <svg class="lead-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
              stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <circle cx="10.8" cy="10.8" r="6.2" />
              <path d="M15.4 15.4 20.6 20.6" />
            </svg>
            <input id="search-input" class="input search" type="search" autocomplete="off"
              spellcheck="false" placeholder="搜索名称 / 地址 / 类型" aria-label="搜索资源" />
          </div>
          <select id="sort-select" class="select sort-select" aria-label="排序方式">
            <option value="default">默认</option>
            <option value="size">大小</option>
            <option value="dimension">尺寸</option>
            <option value="name">名称</option>
          </select>
          <div id="view-seg" class="segmented view-seg" role="group" aria-label="切换视图">
            <button type="button" data-view="grid" aria-pressed="true" aria-label="网格视图" title="网格视图">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
                stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M4.5 4.5h6v6h-6z" />
                <path d="M13.5 4.5h6v6h-6z" />
                <path d="M4.5 13.5h6v6h-6z" />
                <path d="M13.5 13.5h6v6h-6z" />
              </svg>
            </button>
            <button type="button" data-view="list" aria-pressed="false" aria-label="列表视图" title="列表视图">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
                stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M4.5 6h15" />
                <path d="M4.5 12h15" />
                <path d="M4.5 18h15" />
              </svg>
            </button>
          </div>
        </div>

        <div class="toolbar-row toolbar-row-sub">
          <label class="check check-all-wrap" title="全选当前可见资源">
            <input type="checkbox" id="check-all" aria-label="全选当前可见资源" />
            <span class="box"></span>
          </label>
          <span class="check-all-label">全选</span>
          <span id="filter-counts" class="filter-counts">共 0 项</span>
          <div class="spacer"></div>
          <button type="button" class="btn ghost sm btn-clear-selection" id="btn-clear-selection"
            aria-label="清空已选资源">清空</button>
        </div>
      </div>

      <div id="results-scroll" class="results-scroll" tabindex="-1">
        <div id="scan-notice" class="scan-notice" role="status" hidden></div>
        <div id="results-grid" class="results-grid" data-view="grid" role="list" aria-label="资源列表"></div>
        <div id="empty-state" class="empty" hidden></div>
      </div>
    </section>

    <!-- ==================== 状态 5：error ==================== -->
    <section id="view-error" class="view" aria-label="无法扫描">
      <div class="error-wrap">
        <div class="error-orb" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
            stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 3.6 20.8 19.4H3.2z" />
            <path d="M12 9.4v4.2" />
            <path d="M12 16.6v.4" />
          </svg>
        </div>
        <h2 id="error-title">此页面无法扫描</h2>
        <p id="error-msg" class="error-msg">浏览器内部页面不支持资源扫描。</p>
        <div class="row error-acts">
          <button type="button" class="btn primary" id="btn-retry">重试</button>
          <button type="button" class="btn" id="btn-error-settings">检查设置</button>
        </div>
        <p class="dim error-tip" id="error-tip">支持普通网页（http / https）与本地文件（file）。</p>
      </div>
    </section>
  </main>

  <!-- ==================== 底部粘性操作栏（results 态） ==================== -->
  <div id="actionbar" class="actionbar">
    <span id="selected-summary" class="selected-summary">未选择资源</span>
    <div class="spacer"></div>
    <button type="button" class="btn sm" id="btn-download-all">下载全部</button>
    <button type="button" class="btn primary sm" id="btn-download">下载选中</button>
  </div>

  <!-- ==================== 下载面板（downloading 态） ==================== -->
  <div id="download-panel" class="download-panel" aria-live="polite">
    <div class="dl-row">
      <span class="spinner dl-spinner" id="dl-spinner" aria-hidden="true"></span>
      <span class="col grow dl-copy">
        <span class="dl-title" id="dl-title">正在下载</span>
        <span class="dl-sub dim" id="dl-sub">正在准备…</span>
      </span>
      <button type="button" class="btn sm danger" id="btn-cancel-download">取消</button>
    </div>
    <div class="progress dl-bar" id="dl-progress" role="progressbar" aria-label="下载进度"
      aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
      <i></i>
    </div>
    <div class="dl-done" id="dl-done" hidden>
      <span class="dl-done-ico" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
          stroke-linecap="round" stroke-linejoin="round">
          <path d="M5 12.6l4.5 4.5 9-9.6" />
        </svg>
      </span>
      <span class="dl-done-text" id="dl-done-text">下载完成</span>
      <div class="spacer"></div>
      <button type="button" class="btn ghost sm" id="btn-open-downloads">下载目录</button>
      <button type="button" class="btn sm" id="btn-back-results">返回列表</button>
    </div>
  </div>

  <script type="module" src="./popup.js"></script>
</body>
</html>
